<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/citylab.png" />
    <link rel="apple-touch-icon" href="/citylab.png" />
    <title>KiezVision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              eb: {
                50: '#FAFAF2',
                900: '#20201B',
              },
              coral: {
                100: '#FFCFD6',
                500: '#FE4441',
              },
              tsb: '#1E3791',
              kv: {
                chrome: '#EDECE8',
              },
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',
              }
            },
            fontFamily: {
              sans: ['"Host Grotesk"', 'system-ui', 'sans-serif'],
              mono: ['"Host Grotesk"', 'ui-monospace', 'monospace'],
            },
          }
        }
      }
    </script>
    <style>
      @font-face {
        font-family: 'Host Grotesk';
        src: url('/fonts/host-grotesk/HostGrotesk-VariableFont_wght.ttf') format('truetype');
        font-weight: 300 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Host Grotesk';
        src: url('/fonts/host-grotesk/HostGrotesk-Italic-VariableFont_wght.ttf') format('truetype');
        font-weight: 300 900;
        font-style: italic;
        font-display: swap;
      }
      body {
        font-family: 'Host Grotesk', system-ui, sans-serif;
        background-color: #FAFAF2;
        color: #20201B;
        margin: 0;
      }
      .font-mono {
        font-family: 'Host Grotesk', ui-monospace, monospace;
      }
      /* Custom Brutalist scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #FAFAF2;
        border-left: 2px solid #20201B;
      }
      ::-webkit-scrollbar-thumb {
        background: #20201B;
        border: 2px solid #FAFAF2;
      }
      
      @keyframes pixelate-in {
        0% {
          filter: blur(20px);
          opacity: 0;
          transform: scale(1.1);
        }
        50% {
          filter: blur(10px);
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          filter: blur(0px);
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-pixel-reveal {
        animation: pixelate-in 2s ease-out forwards;
      }

      .pixel-grid-layer {
        background-image: 
          linear-gradient(to right, rgba(32,32,27,0.12) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(32,32,27,0.12) 1px, transparent 1px);
        background-size: 8px 8px;
      }

      /* Accessibility: screen-reader-only utility */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      /* Skip-to-content link */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 9999;
        padding: 0.75rem 1.5rem;
        background: #20201B;
        color: #FAFAF2;
        font-weight: 900;
        font-size: 0.875rem;
        border: 2px solid #FE4441;
        text-decoration: none;
      }
      .skip-link:focus {
        left: 8px;
        top: 8px;
      }

      /* Accessible focus ring for interactive elements */
      *:focus-visible {
        outline: 3px solid #FE4441;
        outline-offset: 2px;
      }
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #1E3791;
        outline-offset: 0;
      }

      /* Respect reduced-motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react-router/": "https://aistudiocdn.com/react-router@^7.9.3/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
