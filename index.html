<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/citylab.png" />
    <link rel="apple-touch-icon" href="/citylab.png" />
    <title>KiezVision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              eb: {
                50: '#FAFAF2',
                900: '#20201B',
              },
              coral: {
                100: '#FFCFD6',
                500: '#FE4441',
              },
              tsb: '#1E3791',
              kv: {
                chrome: '#EDECE8',
              },
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',
              }
            },
            fontFamily: {
              sans: ['"Host Grotesk"', 'system-ui', 'sans-serif'],
              mono: ['"Host Grotesk"', 'ui-monospace', 'monospace'],
            },
          }
        }
      }
    </script>
    <style>
      @font-face {
        font-family: 'Host Grotesk';
        src: url('/fonts/host-grotesk/HostGrotesk-VariableFont_wght.ttf') format('truetype');
        font-weight: 300 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Host Grotesk';
        src: url('/fonts/host-grotesk/HostGrotesk-Italic-VariableFont_wght.ttf') format('truetype');
        font-weight: 300 900;
        font-style: italic;
        font-display: swap;
      }
      body {
        font-family: 'Host Grotesk', system-ui, sans-serif;
        background-color: #FAFAF2;
        color: #20201B;
        margin: 0;
      }
      .font-mono {
        font-family: 'Host Grotesk', ui-monospace, monospace;
      }
      /* Custom Brutalist scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #FAFAF2;
        border-left: 2px solid #20201B;
      }
      ::-webkit-scrollbar-thumb {
        background: #20201B;
        border: 2px solid #FAFAF2;
      }
      
      @keyframes pixelate-in {
        0% {
          filter: blur(20px);
          opacity: 0;
          transform: scale(1.1);
        }
        50% {
          filter: blur(10px);
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          filter: blur(0px);
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-pixel-reveal {
        animation: pixelate-in 2s ease-out forwards;
      }

      .pixel-grid-layer {
        background-image: 
          linear-gradient(to right, rgba(32,32,27,0.12) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(32,32,27,0.12) 1px, transparent 1px);
        background-size: 8px 8px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
